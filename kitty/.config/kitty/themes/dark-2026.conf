# dark-2026 -- kitty
# Matches the Neovim colorscheme: https://github.com/dark-2026-theme/nvim
#
# Install:
#   cp themes/dark-2026.conf ~/.config/kitty/themes/dark-2026.conf
# then in ~/.config/kitty/kitty.conf:
#   include themes/dark-2026.conf

background            #121314
foreground            #bbbebf

cursor                #bbbebf
cursor_text_color     #121314

selection_background  #276782
selection_foreground  #ffffff

url_color             #48a0c7

# window / tab chrome
active_border_color   #3994bc
inactive_border_color #2a2b2c
bell_border_color     #cd9731

active_tab_background   #121314
active_tab_foreground   #bfbfbf
inactive_tab_background #191a1b
inactive_tab_foreground #8c8c8c
tab_bar_background      #191a1b

mark1_background      #3994bc
mark1_foreground      #121314
mark2_background      #d2a8ff
mark2_foreground      #121314
mark3_background      #4ec9b0
mark3_foreground      #121314

