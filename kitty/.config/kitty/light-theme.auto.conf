# light-2026 -- kitty
# Matches the Neovim colorscheme: https://github.com/dark-2026-theme/nvim
#
# Install:
#   cp themes/light-2026.conf ~/.config/kitty/themes/light-2026.conf
# then in ~/.config/kitty/kitty.conf:
#   include themes/light-2026.conf

background            #FFFFFF
foreground            #202020

cursor                #0069CC
cursor_text_color     #FFFFFF

selection_background  #C2DAF5
selection_foreground  #202020

url_color             #0069CC

# window / tab chrome
active_border_color   #0069CC
inactive_border_color #F0F1F2
bell_border_color     #953800

active_tab_background   #FFFFFF
active_tab_foreground   #1F1F1F
inactive_tab_background #FAFAFD
inactive_tab_foreground #606060
tab_bar_background      #FAFAFD

mark1_background      #0069CC
mark1_foreground      #FFFFFF
mark2_background      #8250df
mark2_foreground      #FFFFFF
mark3_background      #116329
mark3_foreground      #FFFFFF

# black
color0  #f0f1f2
color8  #999999
